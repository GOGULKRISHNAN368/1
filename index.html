<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Brunello Cucinelli AI: Official boutique for women, men and kids</title>
  <meta property="og:title" content="Brunello Cucinelli AI: Official boutique for women, men and kids" />
  <meta property="og:description" content="Discover Brunello Cucinelli collections on the official online boutique." />
  <meta property="og:image" content="/assets/images/background.jpg" />
  <meta name="robots" content="noindex">

  <style>
    @font-face {
      font-family: 'gt_eesti_pro';
      src: url('/assets/fonts/gt-eesti-pro-display-regular.woff2') format('woff2'),
           url('/assets/fonts/gt-eesti-pro-display-regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'gt_eesti_pro';
      src: url('/assets/fonts/gt-eesti-pro-display-light.woff2') format('woff2'),
           url('/assets/fonts/gt-eesti-pro-display-light.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'quarto';
      src: url('/assets/fonts/quarto-light.woff2') format('woff2'),
           url('/assets/fonts/quarto-light.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0c0c;
      font-family: 'gt_eesti_pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Main Fullscreen Background */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: url('/assets/images/background.jpg'), url('https://media.brunellocucinelli.com/brunellocucinelli-dynamic/image/upload/v1788262292/Callimacus_background_production_version_abcp138492.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Atmospheric Vignette & Subtle Lighting Overlay */
    .hero-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.45) 75%, rgba(0, 0, 0, 0.85) 100%),
                  linear-gradient(to bottom, rgba(0, 0, 0, 0.45) 0%, transparent 18%, transparent 70%, rgba(0, 0, 0, 0.88) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Navigation Header */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 44px;
      z-index: 30;
      pointer-events: none;
    }

    /* Menu UI (Static luxury indicator) */
    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #f1ede7;
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: 13.5px;
      font-weight: 300;
      letter-spacing: 0.05em;
      cursor: default;
      user-select: none;
      pointer-events: auto;
    }

    .hamburger-icon {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      width: 18px;
    }

    .hamburger-icon span {
      display: block;
      width: 100%;
      height: 1.2px;
      background-color: #f1ede7;
    }

    /* Center Brand Logo */
    .brand-logo {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      user-select: none;
      pointer-events: auto;
    }

    .brand-crest {
      width: 32px;
      height: 32px;
      margin-bottom: 7px;
    }

    .brand-crest svg path {
      fill: #f1ede7;
    }

    .brand-name {
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #f1ede7;
      white-space: nowrap;
    }

    /* Top Right Static Icons (Pure visual UI, no operational code as requested) */
    .header-icons {
      position: absolute;
      right: 44px;
      top: 26px;
      display: inline-flex;
      align-items: center;
      gap: 22px;
      pointer-events: none;
    }

    .static-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: #f1ede7;
      cursor: default;
      user-select: none;
      opacity: 0.92;
    }

    .static-icon svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Main Center Stage (Carousel + Headlines) */
    .center-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 14px;
      padding-bottom: 48px;
    }

    /* 3D Perspective Lookbook Carousel */
    .carousel-section {
      --carousel-h: clamp(260px, 39vh, 345px);
      --card-w: calc(var(--carousel-h) * 0.72);
      --card-gap: 18px;
      position: relative;
      width: 100%;
      max-width: 1280px;
      height: var(--carousel-h);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Carousel Cards */
    .carousel-card {
      position: absolute;
      width: var(--card-w);
      height: 100%;
      border-radius: 1px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.2, 0.85, 0.32, 1), 
                  opacity 0.6s cubic-bezier(0.2, 0.85, 0.32, 1),
                  box-shadow 0.6s cubic-bezier(0.2, 0.85, 0.32, 1),
                  border-color 0.6s cubic-bezier(0.2, 0.85, 0.32, 1),
                  -webkit-mask-image 0.6s cubic-bezier(0.2, 0.85, 0.32, 1);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.45);
      background-color: #1a1a1a;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .carousel-card img,
    .carousel-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Positioning slots for 5 visible cards + hidden buffer */
    .carousel-card[data-slot="-2"] {
      transform: translateX(calc(-176% - (2 * var(--card-gap)))) scale(0.84);
      opacity: 0.72;
      z-index: 2;
      border-color: rgba(255, 255, 255, 0.28);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.85) 48%, black 85%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.85) 48%, black 85%);
    }

    .carousel-card[data-slot="-1"] {
      transform: translateX(calc(-92% - var(--card-gap))) scale(0.84);
      opacity: 0.96;
      z-index: 5;
      border-color: rgba(255, 255, 255, 0.68);
      -webkit-mask-image: none;
      mask-image: none;
    }

    .carousel-card[data-slot="0"] {
      transform: translateX(0%) scale(1);
      opacity: 1;
      z-index: 10;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.22);
      -webkit-mask-image: none;
      mask-image: none;
    }

    .carousel-card[data-slot="1"] {
      transform: translateX(calc(92% + var(--card-gap))) scale(0.84);
      opacity: 0.96;
      z-index: 5;
      border-color: rgba(255, 255, 255, 0.68);
      -webkit-mask-image: none;
      mask-image: none;
    }

    .carousel-card[data-slot="2"] {
      transform: translateX(calc(176% + (2 * var(--card-gap)))) scale(0.84);
      opacity: 0.72;
      z-index: 2;
      border-color: rgba(255, 255, 255, 0.28);
      -webkit-mask-image: linear-gradient(to left, transparent 0%, rgba(0,0,0,0.85) 48%, black 85%);
      mask-image: linear-gradient(to left, transparent 0%, rgba(0,0,0,0.85) 48%, black 85%);
    }

    .carousel-card[data-slot="hidden-left"] {
      transform: translateX(calc(-270% - (3 * var(--card-gap)))) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .carousel-card[data-slot="hidden-right"] {
      transform: translateX(calc(270% + (3 * var(--card-gap)))) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Navigation Arrows positioned tightly outside the card group */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(28, 28, 28, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      outline: none;
    }

    .carousel-nav-btn:hover {
      background: rgba(45, 45, 45, 0.88);
      border-color: rgba(255, 255, 255, 0.38);
      transform: translateY(-50%) scale(1.06);
    }

    .carousel-nav-btn.prev {
      left: max(16px, calc(50% - (2.18 * var(--card-w) + (2 * var(--card-gap))) - 26px));
    }

    .carousel-nav-btn.next {
      right: max(16px, calc(50% - (2.18 * var(--card-w) + (2 * var(--card-gap))) - 26px));
    }

    .carousel-nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Center Typography */
    .hero-text-block {
      text-align: center;
      margin-top: clamp(16px, 2.4vh, 26px);
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-title {
      font-family: 'quarto', Georgia, serif;
      font-size: clamp(28px, 3.8vw, 48px);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: clamp(13px, 1.1vw, 16px);
      font-weight: 300;
      letter-spacing: 0.025em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Pill Button: Scroll to explore */
    .scroll-explore-pill {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 22px;
      background: rgba(30, 28, 26, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      text-decoration: none;
    }

    .scroll-explore-pill:hover {
      background: rgba(45, 42, 40, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .scroll-explore-pill svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.85;
    }

    /* Floating AI Prompt Bar */
    .prompt-bar-wrapper {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 580px;
      z-index: 25;
    }

    .prompt-bar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 52px;
      background: rgba(34, 34, 34, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 0 7px;
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .prompt-bar:focus-within {
      background: rgba(42, 42, 42, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .prompt-btn-left,
    .prompt-btn-right {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #f1ede7;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .prompt-btn-left:hover,
    .prompt-btn-right:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.04);
    }

    .prompt-btn-left svg,
    .prompt-btn-right svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .prompt-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 0 14px;
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 0.015em;
    }

    .prompt-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 300;
    }

    /* Bottom Footer */
    .bottom-footer {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 44px;
      z-index: 15;
      pointer-events: none;
    }

    .footer-left,
    .footer-right {
      font-family: 'gt_eesti_pro', sans-serif;
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: 0.07em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      user-select: none;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .top-header {
        padding: 0 24px;
        height: 72px;
      }
      .header-icons {
        right: 24px;
      }
      .carousel-section {
        --carousel-h: clamp(220px, 32vh, 290px);
        --card-gap: 12px;
      }
      .bottom-footer {
        padding: 0 24px;
      }
    }

    @media (max-width: 640px) {
      .carousel-section {
        --carousel-h: clamp(200px, 28vh, 250px);
        --card-gap: 8px;
      }
      .carousel-card[data-slot="-2"],
      .carousel-card[data-slot="2"] {
        display: none;
      }
      .prompt-bar-wrapper {
        bottom: 24px;
        width: calc(100% - 32px);
      }
      .bottom-footer {
        display: none;
      }
    }
  </style>
</head>

  <script>
    // Smooth 3D Editorial Carousel Logic
    (function() {
      const cards = Array.from(document.querySelectorAll('.carousel-card'));
      const totalCards = cards.length;
      let currentIndex = 2; // Center active card (Card 3) initially

      function updateCarousel() {
        cards.forEach((card, idx) => {
          let diff = (idx - currentIndex + totalCards) % totalCards;
          if (diff > totalCards / 2) {
            diff -= totalCards;
          }

          if (diff === 0) {
            card.setAttribute('data-slot', '0');
            // Play video if active card has one
            const vid = card.querySelector('video');
            if (vid) vid.play().catch(() => {});
          } else if (diff === -1) {
            card.setAttribute('data-slot', '-1');
          } else if (diff === 1) {
            card.setAttribute('data-slot', '1');
            const vid = card.querySelector('video');
            if (vid) vid.play().catch(() => {});
          } else if (diff === -2) {
            card.setAttribute('data-slot', '-2');
          } else if (diff === 2) {
            card.setAttribute('data-slot', '2');
          } else if (diff < -2) {
            card.setAttribute('data-slot', 'hidden-left');
          } else {
            card.setAttribute('data-slot', 'hidden-right');
          }
        });
      }

      document.getElementById('carouselPrev').addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + totalCards) % totalCards;
        updateCarousel();
      });

      document.getElementById('carouselNext').addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % totalCards;
        updateCarousel();
      });

      // Clicking any card directly focuses it
      cards.forEach((card, idx) => {
        card.addEventListener('click', () => {
          currentIndex = idx;
          updateCarousel();
        });
      });

      // Keyboard arrow keys navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          currentIndex = (currentIndex - 1 + totalCards) % totalCards;
          updateCarousel();
        } else if (e.key === 'ArrowRight') {
          currentIndex = (currentIndex + 1) % totalCards;
          updateCarousel();
        }
      });

      // Dynamic placeholder cycle for prompt bar
      const placeholders = [
        "I need an outfit for a movie premiere",
        "What should I wear for an aperitif?",
        "Suggest me some looks for a weekend outdoor",
        "A formal evening reception in Milan"
      ];
      let pIdx = 0;
      const input = document.querySelector('.prompt-input');
      setInterval(() => {
        if (input && document.activeElement !== input) {
          pIdx = (pIdx + 1) % placeholders.length;
          input.placeholder = placeholders[pIdx];
        }
      }, 5000);

      updateCarousel();
    })();
  </script>
